appId: com.bookkeeper.app
productName: BookKeeper
directories:
  buildResources: resources
files:
  - out/**/*
asarUnpack:
  - node_modules/better-sqlite3-multiple-ciphers/**
win:
  target: nsis
  icon: resources/icon.png
publish:
  provider: github
  owner: soumaghosh827
  repo: bookkeeper
  releaseType: release
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
